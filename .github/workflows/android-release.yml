name: Publish Android APK
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version under investigation
        required: true
        type: string
permissions: {}
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Inspect Android verification tools without signing secrets
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          from pathlib import Path
          tools = Path(os.environ['ANDROID_HOME']) / 'build-tools'
          versions = sorted((p for p in tools.iterdir() if p.is_dir() and re.fullmatch(r'\d+\.\d+\.\d+', p.name)), key=lambda p: tuple(map(int, p.name.split('.'))))
          for directory in versions:
              executable = directory / 'apksigner'
              print('SDK build tools:', directory.name, flush=True)
              if not executable.exists():
                  print('apksigner missing')
                  continue
              for args in (['--version'], ['verify', '--print-certs', '/tmp/does-not-exist.apk']):
                  result = subprocess.run([str(executable), *args], capture_output=True, text=True)
                  print('Arguments:', args, 'exit:', result.returncode, 'stdout:', repr(result.stdout), 'stderr:', repr(result.stderr))
              print('Launcher:', executable.read_text()[:6000])
          PY
